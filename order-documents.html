<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order documents | One Point</title>
<meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/onepoint.css"><link rel="stylesheet" href="assets/quick-order.css?v=2"><link rel="stylesheet" href="assets/order-documents.css?v=2">
<script src="assets/deployment-config.js?v=1"></script><script src="assets/transaction-host.js?v=2"></script>
<script src="assets/document-upload.js?v=2" defer></script><script src="assets/order-documents.js?v=2" defer></script></head>
<body><main class="container section"><a href="customer-account-orders.html">My orders</a><h1>Send documents for your order</h1><p id="document-order-label"></p><p id="document-state" role="status">Loading order…</p>
<p>Payment and document approval are separate. Processing needs an operator's review.</p><ul id="order-document-requirements"></ul>
<form id="order-document-form" hidden><label for="order-document-files">PDF, JPG or PNG — up to 3MB per file</label><input class="quick-order-input" id="order-document-files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" required><button class="eds-btn eds-btn-secondary" type="button" id="order-document-camera">Use camera</button><div id="order-document-selected" aria-live="polite"></div><button class="eds-btn eds-btn-primary" type="submit">Upload for review</button></form>
<p id="order-upload-feedback" role="status"></p><ul id="order-document-list"></ul><a id="document-whatsapp" hidden target="_blank" rel="noopener">Send via WhatsApp with order reference</a><p><a href="login.html" id="document-login">Sign in to upload documents for this order</a></p></main></body></html>
