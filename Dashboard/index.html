<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening One Point OS</title>
    <script>
      // Redirect to customer account suite if portal=customer, else open admin web app
      var searchParams = new URLSearchParams(window.location.search);
      if (searchParams.get("portal") === "customer") {
        window.location.replace("../customer-account-overview.html");
      } else {
        var params = window.location.search + window.location.hash;
        window.location.replace("web/index.html" + params);
      }
    </script>
  </head>
  <body>
    <p>Opening One Point OS...</p>
  </body>
</html>
