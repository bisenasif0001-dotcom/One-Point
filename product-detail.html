<script id="line-alignment-script">
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(() => {
      document.querySelectorAll(".section-head h2").forEach(h2 => {
        let align = window.getComputedStyle(h2).textAlign;
        let parent = h2.closest('.section-head');
        if (parent) {
          if (align === "center") {
            parent.classList.add("center-line");
          } else {
            parent.classList.add("left-line");
          }
        }
      });
    }, 100); // small delay to ensure CSS is applied
  });
</script>
