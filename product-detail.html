<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Custom Die-Cut Vinyl Stickers with precision laser contour cut, waterproof lamination, and WhatsApp proof approval at OneMart Print Studio by One Point Suvidha Kendra.">
    <title>Die Cut Stickers | OneMart Print Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script src="assets/opds-boot.js?v=anti-fouc-79"></script>
    <link rel="stylesheet" href="assets/onepoint.css?v=customer-checkout-94">

    <style>
      /* ══════════════════════════════════════════════════════════════
         ONEMART PRODUCT DETAIL — MASTER HARMONY DESIGN SYSTEM
         Standardized Tokens:
           Radius: 8px (sm), 12px (md), 18px (lg)
           Colors: Primary #075092, Accent #d2a12a, Success #059669, Dark #081f3a
           Spacing: 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80px
           Typography: Inter (Title 36px, H2 26px, Body 15px, Helper 13px)
         ══════════════════════════════════════════════════════════════ */

      :root {
        --om-r-sm: 8px;
        --om-r-md: 12px;
        --om-r-lg: 18px;
        --om-brand: #075092;
        --om-brand-hover: #0a63b5;
        --om-brand-light: #eff6ff;
        --om-brand-border: #bfdbfe;
        --om-dark: #081f3a;
        --om-gold: #d2a12a;
        --om-success: #059669;
        --om-success-bg: #ecfdf5;
        --om-success-border: #a7f3d0;
        --om-slate: #334155;
        --om-muted: #64748b;
        --om-bg-light: #f8fafc;
        --om-border: #e2e8f0;
        --om-max-w: 1200px;
        --om-pad: 24px;
      }

      html, body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        font-size: 15px;
        line-height: 1.55;
        color: var(--om-dark);
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .h2-gold {
        color: var(--om-gold) !important;
        background: linear-gradient(135deg, #e5b338 0%, #d2a12a 55%, #b6851b 100%) !important;
        -webkit-background-clip: text !important;
        background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        display: inline-block;
      }

      /* ── Breadcrumb ── */
      .pd-breadcrumb-wrap {
        background: #ffffff;
        border-bottom: 1px solid var(--om-border);
      }
      .pd-breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--om-muted);
        max-width: var(--om-max-w);
        margin: 0 auto;
        padding: 14px var(--om-pad);
        flex-wrap: wrap;
      }
      .pd-breadcrumb a { color: var(--om-brand); text-decoration: none; transition: color 0.15s; }
      .pd-breadcrumb a:hover { text-decoration: underline; }
      .pd-breadcrumb span { color: var(--om-dark); font-weight: 750; }

      /* ── Hero Section (2-Column Balanced Master Grid) ── */
      .pd-hero-section {
        padding: 32px 0 48px;
        background: #ffffff;
      }
      .pd-hero-grid {
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 40px;
        max-width: var(--om-max-w);
        margin: 0 auto;
        padding: 0 var(--om-pad);
        align-items: start;
      }
      @media (max-width: 960px) {
        .pd-hero-grid { grid-template-columns: 1fr; gap: 32px; }
      }

      /* ── Left Column: Gallery & Quality Highlights (Sticky & Balanced) ── */
      .pd-left-col {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      @media (min-width: 961px) {
        .pd-left-col {
          position: sticky;
          top: 76px;
          align-self: start;
        }
      }
      .pd-gallery-card {
        background: #ffffff;
        border: 1.5px solid var(--om-border);
        border-radius: var(--om-r-lg);
        padding: 16px;
        box-shadow: 0 2px 12px rgba(8,31,58,0.04);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .pd-main-img-box {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: var(--om-bg-light);
        border-radius: var(--om-r-md);
        overflow: hidden;
        cursor: zoom-in;
      }
      .pd-main-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.35s ease;
        display: block;
      }
      .pd-main-img-box:hover .pd-main-img { transform: scale(1.05); }
      .pd-badge-gold {
        position: absolute;
        top: 14px;
        left: 14px;
        background: linear-gradient(135deg, #e5b338 0%, #d2a12a 55%, #b6851b 100%);
        color: var(--om-dark);
        font-size: 11px;
        font-weight: 850;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 5px 12px;
        border-radius: var(--om-r-sm);
        box-shadow: 0 2px 8px rgba(0,0,0,0.18);
        z-index: 2;
      }
      .pd-zoom-btn {
        position: absolute;
        bottom: 14px;
        right: 14px;
        background: rgba(8, 31, 58, 0.78);
        color: #ffffff;
        backdrop-filter: blur(6px);
        font-size: 12px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: var(--om-r-sm);
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: none;
      }
      .pd-thumb-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .pd-thumb-btn {
        aspect-ratio: 1 / 1;
        border-radius: var(--om-r-sm);
        border: 2px solid var(--om-border);
        background: var(--om-bg-light);
        overflow: hidden;
        cursor: pointer;
        padding: 0;
        transition: all 0.18s ease;
      }
      .pd-thumb-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .pd-thumb-btn:hover { border-color: var(--om-brand-border); }
      .pd-thumb-btn.is-active {
        border-color: var(--om-brand);
        box-shadow: 0 0 0 2px rgba(7, 80, 146, 0.25);
      }

      /* Left Reassurance Cards (Bridges the vertical balance!) */
      .pd-specs-highlight-card {
        background: var(--om-bg-light);
        border: 1.5px solid var(--om-border);
        border-radius: var(--om-r-lg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .pd-spec-header {
        font-size: 13px;
        font-weight: 850;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--om-dark);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pd-specs-2x2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .pd-spec-mini-box {
        background: #ffffff;
        border: 1px solid var(--om-border);
        border-radius: var(--om-r-md);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .pd-spec-mini-box strong {
        font-size: 13px;
        color: var(--om-dark);
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pd-spec-mini-box span {
        font-size: 12px;
        color: var(--om-muted);
        line-height: 1.35;
      }
      .pd-local-fulfillment-bar {
        background: var(--om-brand-light);
        border: 1px solid var(--om-brand-border);
        border-radius: var(--om-r-md);
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .pd-local-info {
        font-size: 12.5px;
        font-weight: 750;
        color: var(--om-brand);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pd-local-sub {
        font-size: 11.5px;
        color: var(--om-muted);
      }
      .pd-sample-pack-link {
        font-size: 11.5px;
        font-weight: 800;
        color: var(--om-brand);
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 6px;
        background: #ffffff;
        border: 1px solid var(--om-brand-border);
        white-space: nowrap;
        transition: all 0.15s ease;
        flex-shrink: 0;
      }
      .pd-sample-pack-link:hover {
        background: var(--om-brand);
        color: #ffffff;
      }

      /* 3. Real Customer Review & Social Proof Card */
      .pd-review-proof-card {
        background: #ffffff;
        border: 1.5px solid var(--om-border);
        border-radius: var(--om-r-lg);
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 2px 8px rgba(8,31,58,0.03);
      }
      .pd-review-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .pd-review-stars {
        color: #f59e0b;
        font-size: 13.5px;
        letter-spacing: 1px;
      }
      .pd-review-score {
        font-size: 12px;
        font-weight: 750;
        color: var(--om-muted);
      }
      .pd-review-quote {
        font-size: 12.5px;
        color: var(--om-slate);
        font-style: italic;
        line-height: 1.45;
        margin: 0;
      }
      .pd-review-author-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        padding-top: 6px;
        border-top: 1px solid var(--om-border);
      }
      .pd-review-author-row strong {
        color: var(--om-dark);
        font-weight: 750;
      }
      .pd-verified-badge {
        color: var(--om-success);
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 11.5px;
      }

      /* 4. 3-Point Guarantee & Reassurance Box */
      .pd-guarantee-box {
        background: var(--om-bg-light);
        border: 1.5px solid var(--om-border);
        border-radius: var(--om-r-lg);
        padding: 14px 16px;
      }
      .pd-guarantee-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .pd-guarantee-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .pd-guarantee-item strong {
        font-size: 12px;
        font-weight: 800;
        color: var(--om-dark);
        display: block;
        line-height: 1.2;
      }
      .pd-guarantee-item span {
        font-size: 11px;
        color: var(--om-muted);
        line-height: 1.35;
        display: block;
        margin-top: 2px;
      }

      /* ── Right Column: Configurator & Purchasing Engine (Pure Canvas, No Outer Box) ── */
      .pd-right-col,
      [data-product-detail] .pd-right-col,
      [data-product-detail] article,
      :root body main .pd-right-col,
      :root body [data-product-detail] .pd-right-col {
        display: flex;
        flex-direction: column;
        gap: 18px;
        border: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        padding: 0 !important;
        border-radius: 0 !important;
        outline: none !important;
      }
      .pd-category-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--om-brand);
        background: var(--om-brand-light);
        border: 1px solid var(--om-brand-border);
        padding: 4px 12px;
        border-radius: 999px;
        align-self: flex-start;
      }
      .pd-product-title {
        font-size: clamp(28px, 3.2vw, 36px);
        font-weight: 900;
        color: var(--om-dark);
        line-height: 1.15;
        margin: 0;
        letter-spacing: -0.02em;
      }
      .pd-meta-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--om-slate);
        flex-wrap: wrap;
      }
      .pd-stars { color: #f59e0b; font-size: 15px; }
      .pd-rating-bold { font-weight: 800; color: var(--om-dark); }
      .pd-stock-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--om-success);
        font-weight: 750;
        background: var(--om-success-bg);
        border: 1px solid var(--om-success-border);
        padding: 2px 8px;
        border-radius: var(--om-r-sm);
        font-size: 12px;
      }
      .pd-dispatch-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--om-brand);
        font-weight: 750;
        font-size: 12px;
      }
      .pd-lead-desc {
        font-size: 14.5px;
        color: var(--om-slate);
        line-height: 1.55;
        margin: 0;
      }
      .pd-micro-tags-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .pd-micro-tag {
        font-size: 12px;
        font-weight: 750;
        color: var(--om-brand);
        background: var(--om-bg-light);
        border: 1px solid var(--om-border);
        padding: 4px 10px;
        border-radius: var(--om-r-sm);
        display: flex;
        align-items: center;
        gap: 5px;
      }

      /* ── Sleek Modular Configurator ── */
      .pd-config-desk {
        background: #ffffff;
        border: 1.5px solid var(--om-border);
        border-radius: var(--om-r-lg);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 2px 10px rgba(8,31,58,0.03);
      }
      .pd-option-block {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pd-block-header {
        font-size: 13px;
        font-weight: 800;
        color: var(--om-dark);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .pd-step-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--om-brand);
        color: #ffffff;
        font-size: 11px;
        font-weight: 850;
        margin-right: 6px;
      }
      .pd-active-choice-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--om-muted);
      }
      .pd-btn-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
        gap: 8px;
      }
      .pd-choice-btn {
        padding: 9px 12px;
        border-radius: var(--om-r-sm);
        border: 1.5px solid var(--om-border);
        background: #ffffff;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--om-slate);
        cursor: pointer;
        transition: all 0.15s ease;
        text-align: center;
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .pd-choice-btn i, .pd-choice-btn svg {
        color: var(--om-brand);
        flex-shrink: 0;
        transition: color 0.15s ease;
      }
      .pd-choice-btn:hover {
        border-color: var(--om-brand);
        color: var(--om-brand);
        background: var(--om-brand-light);
      }
      .pd-choice-btn.is-selected {
        border-color: var(--om-brand);
        background: var(--om-brand);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(7, 80, 146, 0.22);
      }
      .pd-choice-btn.is-selected i, .pd-choice-btn.is-selected svg {
        color: #ffffff;
      }

      /* 2-Column Selectors for Space Efficiency */
      .pd-2col-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 580px) {
        .pd-2col-options { grid-template-columns: 1fr; }
      }

      /* ── Quantity Tiers (3×2 Responsive Matrix) ── */
      .pd-quantity-matrix {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      @media (max-width: 520px) {
        .pd-quantity-matrix { grid-template-columns: repeat(2, 1fr); }
      }
      .pd-qty-tile {
        padding: 10px 8px;
        border-radius: var(--om-r-md);
        border: 1.5px solid var(--om-border);
        background: #ffffff;
        cursor: pointer;
        transition: all 0.15s ease;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        position: relative;
      }
      .pd-qty-tile:hover { border-color: var(--om-brand); }
      .pd-qty-tile.is-selected {
        border-color: var(--om-brand);
        background: var(--om-brand-light);
        box-shadow: 0 0 0 2px rgba(7, 80, 146, 0.15);
      }
      .pd-qty-pcs { font-size: 14.5px; font-weight: 850; color: var(--om-dark); }
      .pd-qty-price { font-size: 13px; color: var(--om-muted); font-weight: 600; }
      .pd-qty-unit { font-size: 12px; color: var(--om-success); font-weight: 750; }
      .pd-qty-tag {
        font-size: 9.5px;
        font-weight: 850;
        text-transform: uppercase;
        color: #b45309;
        background: #fef3c7;
        padding: 1px 6px;
        border-radius: 4px;
        margin-top: 2px;
      }

      /* ── Drag & Drop Artwork Box ── */
      .pd-artwork-dropzone {
        border: 2px dashed var(--om-brand-border);
        background: #ffffff;
        border-radius: var(--om-r-md);
        padding: 16px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: all 0.18s ease;
        position: relative;
      }
      .pd-artwork-dropzone:hover { background: #f0f7ff; border-color: var(--om-brand); }
      .pd-file-native-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
      .pd-dropzone-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--om-r-sm);
        background: var(--om-brand-light);
        color: var(--om-brand);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pd-dropzone-text strong { font-size: 13.5px; color: var(--om-dark); display: block; }
      .pd-dropzone-text span { font-size: 12px; color: var(--om-muted); }
      .pd-uploaded-status-bar {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 750;
        color: var(--om-success);
        background: var(--om-success-bg);
        border: 1px solid var(--om-success-border);
        padding: 6px 12px;
        border-radius: var(--om-r-sm);
        width: 100%;
        justify-content: center;
      }
      .pd-file-actions-row {
        display: none;
        gap: 8px;
        margin-top: 4px;
      }
      .pd-file-actions-row button {
        font-size: 12px;
        font-weight: 750;
        padding: 3px 10px;
        border-radius: var(--om-r-sm);
        border: 1px solid var(--om-border);
        background: #ffffff;
        color: var(--om-brand);
        cursor: pointer;
      }
      .pd-file-actions-row button:hover { background: var(--om-brand-light); }
      .pd-file-actions-row .pd-btn-remove { color: #dc2626; border-color: #fecaca; }
      .pd-design-desk-cta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 12.5px;
        gap: 10px;
      }
      .pd-design-desk-cta-row span { color: var(--om-muted); }
      .pd-design-desk-cta-row a {
        color: var(--om-brand);
        font-weight: 750;
        text-decoration: none;
        padding: 4px 12px;
        border: 1px solid var(--om-brand-border);
        border-radius: var(--om-r-sm);
        background: var(--om-brand-light);
        transition: all 0.15s;
        white-space: nowrap;
      }
      .pd-design-desk-cta-row a:hover { background: var(--om-brand); color: #ffffff; }

      /* ── Modern Invoice-Style Order Summary ── */
      .pd-summary-invoice-strip {
        background: #ffffff;
        border: 1.5px solid var(--om-brand-border);
        border-radius: var(--om-r-md);
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .pd-sum-main-price {
        font-size: 26px;
        font-weight: 900;
        color: var(--om-brand);
        line-height: 1.1;
      }
      .pd-sum-config-text {
        font-size: 13px;
        color: var(--om-slate);
        font-weight: 600;
        margin-top: 3px;
      }
      .pd-sum-unit-rate {
        font-size: 13px;
        color: var(--om-dark);
        font-weight: 750;
        margin-top: 2px;
      }
      .pd-sum-right-meta { text-align: right; }
      .pd-sum-save-badge {
        font-size: 11.5px;
        font-weight: 800;
        color: var(--om-success);
        background: var(--om-success-bg);
        border: 1px solid var(--om-success-border);
        padding: 2px 8px;
        border-radius: var(--om-r-sm);
        display: inline-block;
      }
      .pd-sum-timeline {
        font-size: 12.5px;
        font-weight: 750;
        color: var(--om-brand);
        display: flex;
        align-items: center;
        gap: 4px;
        justify-content: flex-end;
        margin-top: 4px;
      }
      .pd-sum-pickup-note {
        font-size: 11.5px;
        color: var(--om-muted);
        margin-top: 2px;
      }

      /* ── Action Stack (Clear Visual Hierarchy & Premium Touch) ── */
