<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting... | One Point Digital Services</title>
    <!-- Meta Refresh fallback for instant redirection if JS is disabled -->
    <meta http-equiv="refresh" content="0; url=login.html?tab=otp">
    <script>
      // Instant replace redirect to prevent loop on back button clicks
      window.location.replace("login.html?tab=otp");
    </script>
      <link rel="stylesheet" href="assets/onepoint.css?v=2">

    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0f172a;
        color: #cbd5e1;
        font-family: 'Inter', sans-serif;
      }
      .loader-container {
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      p {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.05em;
      }
    </style></head>
  <body>
    <div class="loader-container">
      <div class="spinner"></div>
      <p>Redirecting to Secure OTP Login Portal...</p>
    </div>
  </body>
</html>
